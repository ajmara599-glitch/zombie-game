<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Night Sky -->
    <radialGradient id="nightSky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f2c42" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>

    <!-- Wood Plank Gradient -->
    <linearGradient id="woodPlank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d4925" />
      <stop offset="25%" stop-color="#6f3517" />
      <stop offset="65%" stop-color="#55260e" />
      <stop offset="100%" stop-color="#3b1706" />
    </linearGradient>

    <!-- Wood Trim -->
    <linearGradient id="woodBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b46332" />
      <stop offset="50%" stop-color="#733716" />
      <stop offset="100%" stop-color="#2a0f03" />
    </linearGradient>

    <!-- Text 3D Gradient -->
    <linearGradient id="tdiGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="35%" stop-color="#ffb300" />
      <stop offset="80%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>

    <!-- Fire Gradients -->
    <radialGradient id="fireGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="30%" stop-color="#ffb74d" />
      <stop offset="60%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#d50000" stop-opacity="0" />
    </radialGradient>

    <filter id="comicDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#nightSky)" />

  <!-- Moon glow in background -->
  <circle cx="256" cy="190" r="140" fill="#fff9c4" opacity="0.12" />
  <circle cx="256" cy="190" r="95" fill="#fffde7" opacity="0.22" />

  <!-- Silhouette pine trees -->
  <polygon points="50,380 90,260 130,380" fill="#0c131d" />
  <polygon points="70,390 120,290 170,390" fill="#0e1724" />
  <polygon points="340,390 390,280 440,390" fill="#0e1724" />
  <polygon points="380,380 420,260 460,380" fill="#0c131d" />

  <!-- Sign Post Stakes -->
  <path d="M125 120 L145 120 L140 430 L120 430 Z" fill="#3e1d0c" stroke="#120702" stroke-width="5" />
  <path d="M370 120 L390 120 L385 430 L365 430 Z" fill="#3e1d0c" stroke="#120702" stroke-width="5" />

  <!-- Main Wooden Camp Signboard -->
  <g filter="url(#comicDrop)">
    <!-- Outer board contour -->
    <path d="M 45 150 
             Q 40 180, 48 220 
             Q 42 270, 50 310
             L 462 310
             Q 470 260, 464 220
             Q 472 170, 460 150
             L 256 142 Z" 
          fill="url(#woodPlank)" 
          stroke="#1a0903" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Wood grain lines -->
    <path d="M 70 180 Q 200 175 440 182" stroke="#4a1e08" stroke-width="4" fill="none" opacity="0.7" />
    <path d="M 60 230 Q 260 235 450 228" stroke="#3b1504" stroke-width="5" fill="none" opacity="0.8" />
    <path d="M 75 275 Q 240 270 435 278" stroke="#4a1e08" stroke-width="4" fill="none" opacity="0.7" />

    <!-- Signboard bolts / rivets -->
    <circle cx="135" cy="170" r="7" fill="#8d99ae" stroke="#2b2d42" stroke-width="3" />
    <circle cx="135" cy="285" r="7" fill="#8d99ae" stroke="#2b2d42" stroke-width="3" />
    <circle cx="378" cy="170" r="7" fill="#8d99ae" stroke="#2b2d42" stroke-width="3" />
    <circle cx="378" cy="285" r="7" fill="#8d99ae" stroke="#2b2d42" stroke-width="3" />

    <!-- "TOTAL" text banner badge -->
    <rect x="180" y="152" width="152" height="32" rx="6" fill="#c0392b" stroke="#110502" stroke-width="5" />
    <text x="256" y="174" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#ffffff" 
          stroke="#000000" 
          stroke-width="2">TOTAL</text>

    <!-- "DRAMA" text in signature TDI bold comic block -->
    <text x="256" y="235" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="url(#tdiGold)" 
          stroke="#000000" 
          stroke-width="11" 
          paint-order="stroke fill">DRAMA</text>

    <!-- "ISLAND" text -->
    <text x="256" y="295" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="#ffea00" 
          stroke="#000000" 
          stroke-width="9" 
          paint-order="stroke fill">ISLAND</text>
  </g>

  <!-- Campfire at bottom -->
  <g transform="translate(0, 10)">
    <!-- Campfire Stones -->
    <ellipse cx="256" cy="455" rx="140" ry="26" fill="#181310" stroke="#000000" stroke-width="6" />
    <ellipse cx="170" cy="455" rx="25" ry="15" fill="#4a5568" stroke="#1a202c" stroke-width="4" />
    <ellipse cx="215" cy="465" rx="30" ry="18" fill="#718096" stroke="#2d3748" stroke-width="4" />
    <ellipse cx="265" cy="466" rx="32" ry="19" fill="#4a5568" stroke="#1a202c" stroke-width="4" />
    <ellipse cx="315" cy="462" rx="28" ry="16" fill="#718096" stroke="#2d3748" stroke-width="4" />
    <ellipse cx="350" cy="454" rx="22" ry="14" fill="#4a5568" stroke="#1a202c" stroke-width="4" />

    <!-- Burning Logs -->
    <line x1="180" y1="460" x2="330" y2="420" stroke="#5d4037" stroke-width="18" stroke-linecap="round" />
    <line x1="180" y1="460" x2="330" y2="420" stroke="#27150d" stroke-width="18" stroke-dasharray="10 25" stroke-linecap="round" />
    <line x1="330" y1="460" x2="180" y2="420" stroke="#4e342e" stroke-width="18" stroke-linecap="round" />

    <!-- Flames Glow -->
    <circle cx="256" cy="390" r="75" fill="url(#fireGlow)" />

    <!-- Stylized TDI Flames -->
    <!-- Red outer flame -->
    <path d="M 200 440 
             Q 180 370 215 340 
             Q 230 380 240 330 
             Q 260 280 270 335 
             Q 290 355 315 350 
             Q 300 400 312 440 Z" 
          fill="#ff3d00" 
          stroke="#000000" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Orange mid flame -->
    <path d="M 215 440 
             Q 200 385 230 360 
             Q 245 390 255 345 
             Q 275 325 278 365 
             Q 295 385 295 440 Z" 
          fill="#ff9100" 
          stroke="#000000" 
          stroke-width="5" />

    <!-- Yellow core flame -->
    <path d="M 230 440 
             Q 220 400 245 380 
             Q 256 365 265 390 
             Q 280 405 278 440 Z" 
          fill="#ffea00" />
  </g>

  <!-- Marshmallow on stick crossing the screen -->
  <g transform="rotate(-28 110 330)">
    <!-- Skewer stick -->
    <line x1="20" y1="330" x2="260" y2="330" stroke="#a1887f" stroke-width="7" stroke-linecap="round" />
    <line x1="20" y1="330" x2="260" y2="330" stroke="#3e2723" stroke-width="7" stroke-dasharray="15 30" stroke-linecap="round" />
    <!-- Roasted Marshmallow -->
    <rect x="180" y="315" width="45" height="30" rx="8" fill="#fff8e1" stroke="#2e1c0c" stroke-width="5" />
    <!-- Toasted spot -->
    <ellipse cx="202" cy="330" rx="14" ry="8" fill="#d7ccc8" />
    <ellipse cx="205" cy="330" rx="9" ry="5" fill="#8d6e63" />
  </g>
</svg>
