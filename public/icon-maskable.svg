<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlowM" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="coreGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldBorderM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bladeGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldElysiumM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="neonCyanM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGlowM)" />

  <!-- Cyber Grid Backdrop -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.35">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Safe Zone content: scaled down to 76% and centered so it never gets clipped -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Glow -->
    <circle cx="256" cy="240" r="210" fill="url(#coreGlowM)" />

    <!-- Hexagonal Tech Shield Frame -->
    <polygon points="256,42 430,126 430,366 256,450 82,366 82,126" 
      fill="#090d16" fill-opacity="0.9" 
      stroke="url(#shieldBorderM)" stroke-width="7" 
      stroke-linejoin="round" />

    <!-- Inner Shield Inset Border -->
    <polygon points="256,62 410,136 410,350 256,428 102,350 102,136" 
      fill="none" 
      stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"
      stroke-dasharray="16, 8" />

    <!-- Biohazard Symbol Behind Weapon -->
    <g transform="translate(256, 230)" opacity="0.35" stroke="#f43f5e" stroke-width="4" fill="none">
      <circle r="92" stroke-dasharray="24, 12" />
      <circle r="70" />
      <circle r="36" fill="#f43f5e" fill-opacity="0.15" />
      <circle cx="0" cy="-42" r="38" />
      <circle cx="-36" cy="21" r="38" />
      <circle cx="36" cy="21" r="38" />
    </g>

    <!-- Crossed Cyber Katana 1 -->
    <g transform="rotate(45, 256, 236)" filter="url(#neonCyanM)">
      <polygon points="256,70 263,90 261,370 251,370 249,90" fill="url(#bladeGradM)" />
      <line x1="256" y1="72" x2="256" y2="368" stroke="#ffffff" stroke-width="3" />
      <rect x="236" y="368" width="40" height="8" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <rect x="250" y="376" width="12" height="60" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <circle cx="256" cy="440" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Crossed Cyber Katana 2 -->
    <g transform="rotate(-45, 256, 236)" filter="url(#neonCyanM)">
      <polygon points="256,70 263,90 261,370 251,370 249,90" fill="url(#bladeGradM)" />
      <line x1="256" y1="72" x2="256" y2="368" stroke="#ffffff" stroke-width="3" />
      <rect x="236" y="368" width="40" height="8" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <rect x="250" y="376" width="12" height="60" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <circle cx="256" cy="440" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Stylized Cyber Skull -->
    <g transform="translate(256, 226)">
      <path d="M -54,-24 C -54,-64 -32,-84 0,-84 C 32,-84 54,-64 54,-24 C 54,-4 44,14 34,22 L 32,46 C 32,50 28,54 24,54 L -24,54 C -28,54 -32,50 -32,46 L -34,22 C -44,14 -54,-4 -54,-24 Z" 
        fill="#090d16" stroke="#38bdf8" stroke-width="5" />
      
      <circle cx="-20" cy="-14" r="14" fill="#042f2e" stroke="#14b8a6" stroke-width="3" />
      <circle cx="-20" cy="-14" r="6" fill="#2dd4bf" filter="url(#neonCyanM)" />

      <polygon points="12,-20 28,-22 32,-8 18,-6" fill="#450a0a" stroke="#f43f5e" stroke-width="3" />
      <circle cx="22" cy="-13" r="5" fill="#ef4444" />

      <polygon points="0,-2 -7,10 7,10" fill="#38bdf8" opacity="0.85" />

      <rect x="-20" y="28" width="8" height="18" rx="2" fill="#e2e8f0" stroke="#090d16" stroke-width="1.5" />
      <rect x="-9" y="28" width="8" height="20" rx="2" fill="#e2e8f0" stroke="#090d16" stroke-width="1.5" />
      <rect x="1" y="28" width="8" height="20" rx="2" fill="#e2e8f0" stroke="#090d16" stroke-width="1.5" />
      <rect x="12" y="28" width="8" height="18" rx="2" fill="#e2e8f0" stroke="#090d16" stroke-width="1.5" />

      <path d="M -16,-62 L 16,-62 L 16,-52 L -6,-52 L -6,-44 L 12,-44 L 12,-36 L -6,-36 L -6,-26 L 16,-26 L 16,-16 L -16,-16 Z" 
        fill="url(#goldElysiumM)" stroke="#fef08a" stroke-width="1.5" />
    </g>

    <!-- Top Badge -->
    <g transform="translate(256, 92)">
      <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#020617" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="3" fill="#38bdf8">
        3D ACTION
      </text>
    </g>

    <!-- Bottom Typography "ЭЛИЗИУМ" -->
    <g transform="translate(256, 415)">
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="7" fill="#ffffff">
        ЭЛИЗИУМ
      </text>
    </g>
  </g>
</svg>
